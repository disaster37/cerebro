# WARNING: Replace every placeholder value below before running kubectl apply.
#   session-key: Use openssl rand -hex 32 (MUST be unique)
#   basic-auth-password: Only needed if auth.type=basic is configured
#   ldap-bind-password: Only needed if auth.type=ldap is configured
#
# The application will fail at startup if auth is enabled but the secret
# key matches the well-known default. Do NOT deploy with these placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: cerebro-secret
  namespace: cerebro
  labels:
    app: cerebro
    app.kubernetes.io/name: cerebro
type: Opaque
stringData:
  # REQUIRED: random session key >=32 bytes. Generate with:
  #   openssl rand -hex 32
  session-key: "CHANGE_ME_openssl_rand_hex_32"  # ⬅ REQUIRED: replace with openssl rand -hex 32
  # Used when auth.type == basic (set BASIC_AUTH_PWD env in deployment.yaml):
  # basic-auth-password: "CHANGE_ME"
  # Used when auth.type == ldap (set LDAP_BIND_PWD env in deployment.yaml):
  # ldap-bind-password: "CHANGE_ME"
