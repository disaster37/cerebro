{{/* WARNING: When exposing cerebro via Ingress, always configure TLS.
   For production, add nginx.ingress.kubernetes.io/ssl-redirect: "true"
   or the Traefik equivalent to ingress.annotations in values.yaml. */}}
{{- if .Values.ingress.enabled }}
# cerebro's SPA fallback handles subpaths. If config.basePath is set, the
# ingress path and the probes must match it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cerebro.fullname" . }}
  labels:
    {{- include "cerebro.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "cerebro.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
