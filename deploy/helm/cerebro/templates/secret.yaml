{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cerebro.fullname" . }}
  labels:
    {{- include "cerebro.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.sessionKey }}
  session-key: {{ .Values.secret.sessionKey | quote }}
  {{- end }}
  {{- if eq .Values.config.auth.type "basic" }}
  basic-auth-password: {{ .Values.secret.basicAuthPassword | quote }}
  {{- end }}
  {{- if eq .Values.config.auth.type "ldap" }}
  ldap-bind-password: {{ .Values.secret.ldapBindPassword | quote }}
  {{- end }}
{{- end }}
